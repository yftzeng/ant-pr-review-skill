[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ant-pr-review"
version = "0.1.0"
description = "Multi-model, multi-vendor PR publishing and operations risk review (CLI + Claude skill)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=4"]
render = ["playwright>=1.40"]
test = ["pytest>=8"]

[project.scripts]
ant-pr-review = "ant_pr_review.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ant_pr_review = ["locales/*.json", "checklists/*.toml", "jurisdictions/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
