# The risk checklist. Every model answers every item of its unit (D-PR-3).
# lens: which seat asks it; directions: where it applies; dimension: register
# column; red_line: the veto it can support (optional).

[[item]]
id = "LEG-01"
lens = "legal"
directions = ["outbound", "operation"]
dimension = "legal"
red_line = "fabrication_about_party"
text = "Statements of fact about a named person, company or agency: is each provable as true with evidence we hold today (defamation, disparagement of goods or business reputation)? Separate fact from opinion."

[[item]]
id = "LEG-02"
lens = "legal"
directions = ["outbound"]
dimension = "legal"
text = "Comparative, superlative or absolute claims (best, first, only, No. 1, X% better, guaranteed): substantiated and not misleading under this jurisdiction's advertising and fair-trading law? One real, contemporaneous counterexample defeats 'only' or 'first'."

[[item]]
id = "LEG-03"
lens = "legal"
directions = ["outbound", "operation"]
dimension = "disclosure"
red_line = "undisclosed_inauthentic"
text = "Paid, sponsored, gifted or affiliated content, including ghostwritten bylines: is the material connection disclosed clearly where this jurisdiction requires it (endorsement and advertorial rules)?"

[[item]]
id = "LEG-04"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
dimension = "legal"
red_line = "privacy_doxxing"
text = "Personal data: does the content or plan identify private individuals, or use or expose personal data without a lawful basis?"

[[item]]
id = "LEG-05"
lens = "legal"
directions = ["outbound", "operation"]
dimension = "legal"
red_line = "health_claims"
text = "Health, medical, food, drug or cosmetic claims: does any claim of effect, cure or safety appear that this jurisdiction restricts?"

[[item]]
id = "LEG-06"
lens = "legal"
directions = ["outbound", "operation"]
dimension = "legal"
red_line = "market_manipulation"
text = "Price-sensitive information about a listed company (ours or another's): could this move a market price, or breach disclosure rules or quiet periods?"

[[item]]
id = "LEG-07"
lens = "legal"
directions = ["outbound", "operation"]
dimension = "legal"
red_line = "election_law"
text = "Elections and politics: does it touch candidates, parties, referendums or polls, or fall in an election period where this jurisdiction limits rumours, polls, ads or campaigning?"

[[item]]
id = "LEG-08"
lens = "legal"
directions = ["outbound", "operation"]
dimension = "legal"
text = "Intellectual property: third-party trademarks, images, text, music or quotes used lawfully and with permission or a valid exception?"

[[item]]
id = "LEG-09"
lens = "legal"
directions = ["operation"]
dimension = "disclosure"
red_line = "undisclosed_inauthentic"
text = "Does the plan use fake or borrowed identities, undisclosed paid posters, coordinated accounts, review manipulation or staged 'grassroots' activity?"

[[item]]
id = "LEG-10"
lens = "legal"
directions = ["inbound"]
dimension = "legal"
text = "Which statements in the hostile content are actionable under this jurisdiction (defamation, disparagement, privacy, trade secrets), what must we prove, and what does pursuing them cost us?"

[[item]]
id = "JOU-01"
lens = "journalist"
directions = ["outbound", "operation"]
dimension = "backlash"
text = "Write the worst plausible headline about us if this is published or exposed (also fill worst_headlines). Is the story the message, or us?"

[[item]]
id = "JOU-02"
lens = "journalist"
directions = ["outbound", "operation"]
dimension = "provability"
text = "Which claims would a reporter ask us to prove, and could we answer on the record today with documents?"

[[item]]
id = "JOU-03"
lens = "journalist"
directions = ["outbound"]
dimension = "backlash"
text = "Does it contradict our past statements, actions or known facts that a reporter could put side by side?"

[[item]]
id = "JOU-04"
lens = "journalist"
directions = ["outbound", "operation"]
dimension = "timing"
text = "Timing: does the publish window collide with sensitive dates, disasters, ongoing crises or news about the named parties (see the context section)?"

[[item]]
id = "JOU-05"
lens = "journalist"
directions = ["operation"]
dimension = "attribution"
text = "If a reporter obtained this plan document, what is the story, and how likely is it to be traced back to us?"

[[item]]
id = "SOC-01"
lens = "social"
directions = ["outbound"]
dimension = "backlash"
text = "Which sentence or image is most likely to be screenshotted, memed or quoted out of context in this jurisdiction's online communities?"

[[item]]
id = "SOC-02"
lens = "social"
directions = ["outbound", "operation"]
dimension = "backlash"
text = "Does the tone read as arrogant, tone-deaf, mocking or punching down to the main communities of this jurisdiction?"

[[item]]
id = "SOC-03"
lens = "social"
directions = ["outbound", "inbound"]
dimension = "backlash"
text = "Streisand risk: does publishing or replying amplify something that would otherwise fade?"

[[item]]
id = "SOC-04"
lens = "social"
directions = ["operation"]
dimension = "attribution"
text = "If users find undisclosed links (staff accounts, agency, paid posters or KOLs), what happens to us and the people involved? Assess only; never suggest how to hide the links."

[[item]]
id = "SOC-05"
lens = "social"
directions = ["outbound", "operation"]
dimension = "ethics"
red_line = "hate_human_rights"
text = "Does anything demean or stereotype a race, ethnicity, nationality, gender, sexual orientation, religion, disability or other protected group?"

[[item]]
id = "SOC-06"
lens = "social"
directions = ["inbound"]
dimension = "backlash"
text = "How far and how fast is the hostile content likely to spread in this jurisdiction, and in which communities?"

[[item]]
id = "TGT-01"
lens = "target"
directions = ["outbound"]
dimension = "provability"
text = "As the named party: how would you answer publicly, and what counter-evidence could you publish?"

[[item]]
id = "TGT-02"
lens = "target"
directions = ["outbound"]
dimension = "legal"
text = "As the named party's lawyer: do you have grounds and an incentive to sue, complain to a regulator or demand a retraction?"

[[item]]
id = "TGT-03"
lens = "target"
directions = ["outbound"]
dimension = "ethics"
text = "Does it attack a person (a private individual, an employee, a weaker party) rather than an organisation's conduct?"

[[item]]
id = "REG-01"
lens = "regulator"
directions = ["outbound", "operation"]
dimension = "legal"
text = "Which regulator of this jurisdiction could act on this content or plan, on what basis, and how likely is a complaint?"

[[item]]
id = "REG-02"
lens = "regulator"
directions = ["outbound", "operation"]
dimension = "platform"
text = "Platform policy: would a platform where this runs remove it or restrict the account or ad account (inauthentic behaviour, fake engagement, misleading ads, political ad rules)?"

[[item]]
id = "REG-03"
lens = "regulator"
directions = ["outbound"]
dimension = "legal"
text = "Mandatory disclosures or approvals: are required labels, licence numbers, risk warnings or pre-approvals missing?"

[[item]]
id = "REG-04"
lens = "regulator"
directions = ["inbound"]
dimension = "platform"
text = "Which notice-and-takedown, right-of-reply or regulator complaint routes exist here, and what do they require?"

[[item]]
id = "INT-01"
lens = "internal"
directions = ["outbound"]
dimension = "stakeholder"
text = "Employees: would staff feel misrepresented or exposed, and is there a leak or walk-out risk?"

[[item]]
id = "INT-02"
lens = "internal"
directions = ["outbound"]
dimension = "stakeholder"
text = "Investors and partners: does it create disclosure duties, breach agreements or put partners in an awkward position?"

[[item]]
id = "INT-03"
lens = "internal"
directions = ["outbound"]
dimension = "stakeholder"
text = "Sign-off: is there evidence that everyone who must approve (legal, management, partners, people quoted) has approved, and does no statement in a named person's first person claim an experience or a quote that person has not confirmed?"

[[item]]
id = "WHB-01"
lens = "whistleblower"
directions = ["operation"]
dimension = "attribution"
text = "Who inside or among contractors could leak this plan, and which part is most damaging when leaked?"

[[item]]
id = "WHB-02"
lens = "whistleblower"
directions = ["operation"]
dimension = "legal"
text = "Does the plan ask anyone to do something they could later be compelled to testify about (fake accounts, undisclosed payments, false statements)?"

[[item]]
id = "WHB-03"
lens = "whistleblower"
directions = ["operation"]
dimension = "ethics"
text = "Is there a transparent, attributable way to reach the same communication goal? Describe it."

[[item]]
id = "THR-01"
lens = "threat"
directions = ["inbound"]
dimension = "provability"
text = "Break the hostile content into discrete allegations; for each: verifiable fact, false, true, or opinion? Extract each as a claim of type allegation."

[[item]]
id = "THR-02"
lens = "threat"
directions = ["inbound"]
dimension = "attribution"
text = "Inside the provided material only: are there textual signs of coordination (identical phrasing, template structure, synchronized timestamps)? Never identify or guess the people behind accounts."

[[item]]
id = "THR-03"
lens = "threat"
directions = ["inbound"]
dimension = "provability"
text = "Which allegations have a factual basis that we must address rather than rebut?"

[[item]]
id = "THR-04"
lens = "threat"
directions = ["inbound"]
dimension = "stakeholder"
text = "Does the content contain our confidential information, suggesting a leak we must handle internally?"

[[item]]
id = "RSP-01"
lens = "response"
directions = ["inbound"]
dimension = "backlash"
text = "Compare silence, monitoring, an internal correction, a targeted reply to those affected, a public clarification, apology or correction, legal action and platform notice: the main risk, the commitment it creates and how reversible each is. Public action must justify the attention it creates."

[[item]]
id = "RSP-02"
lens = "response"
directions = ["inbound"]
dimension = "provability"
text = "What can we say on the record now that is entirely provable?"

[[item]]
id = "RSP-03"
lens = "response"
directions = ["inbound"]
dimension = "stakeholder"
text = "Who must hear from us before any public reply (staff, partners, regulators, the people affected)?"

# ---- posture items (D-0002): asked only under their posture ----

[[item]]
id = "CLR-01"
lens = "journalist"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize"]
dimension = "provability"
text = "Clarification: is every point we correct backed by evidence we can publish, and does the clarification avoid repeating the original claim in a way that spreads it further?"

[[item]]
id = "CLR-02"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
postures = ["clarify_apologize"]
dimension = "legal"
red_line = "fabrication_about_party"
text = "Clarification: does the correction state anything about a named party that we cannot prove, or concede facts we have not checked?"

[[item]]
id = "APO-01"
lens = "social"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize"]
dimension = "backlash"
text = "Apology, where one is due: does it name the specific wrong, take responsibility without blaming others, say what we do to fix it and avoid conditional wording such as 'if anyone was offended'? Where the facts show a wrong, is a clarification alone read as evasion? (na if nothing calls for an apology)"

[[item]]
id = "APO-02"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
postures = ["clarify_apologize"]
dimension = "legal"
text = "Apology: could the wording be used as an admission of liability in this jurisdiction (litigation, regulator, insurer), and is that exposure accepted on purpose?"

[[item]]
id = "PRO-01"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
postures = ["promote"]
dimension = "legal"
text = "Advertising and campaigns: are prices, scarcity ('limited', 'today only'), awards, rankings, testimonials and before/after results true and substantiated, are giveaways, lotteries and referral rewards within this jurisdiction's rules, and is every paid or gifted endorsement disclosed?"

[[item]]
id = "PRO-02"
lens = "social"
directions = ["outbound", "operation"]
postures = ["promote"]
dimension = "backlash"
text = "Hype: does the campaign ride a disaster, a sensitive date or a social movement, overpromise, or use a stunt that communities in this jurisdiction will call fake or tasteless?"

[[item]]
id = "EXP-01"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
postures = ["expose"]
dimension = "legal"
red_line = "fabrication_about_party"
text = "Exposé of a named party: is each allegation provable with documents we may lawfully use and disclose (not obtained by intrusion, not under a confidentiality, NDA or trade-secret duty, no private individual's personal data), made on the record by us, and lawful under this jurisdiction's defamation, privacy, securities and trade-secret rules? Would reporting to a regulator, prosecutor or court first be the lawful route?"

[[item]]
id = "EXP-02"
lens = "target"
directions = ["outbound", "operation"]
postures = ["expose"]
dimension = "stakeholder"
text = "How does the named party hit back (denial with documents, lawsuit, regulator complaint, leaks about us), and are we ready for each?"

[[item]]
id = "EXP-03"
lens = "journalist"
directions = ["outbound", "operation"]
postures = ["expose"]
dimension = "attribution"
text = "Would the exposé read as a smear campaign: timed against the party's listing, deal, election or launch, seeded through unattributed third parties or media 'sources', or built on selected documents that leave out context? Seeding without attribution is a black means."

[[item]]
id = "RBT-01"
lens = "journalist"
directions = ["outbound", "inbound"]
postures = ["rebut"]
dimension = "backlash"
text = "Answering a smear: does the reply repeat or amplify the false claim, answer with facts we can show rather than attacking its source, and weigh silence, a short correction and a full answer?"

[[item]]
id = "RBT-02"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
postures = ["rebut"]
dimension = "legal"
text = "Answering a smear: is the hostile content preserved (URL, time, capture) before any takedown request, and do the legal steps (notice, platform report, complaint, lawsuit) fit this jurisdiction's defamation and platform rules without silencing lawful criticism (a SLAPP risk)?"

# ---- borrowed items (D-0003; sources in docs/REFERENCES.md) ----

[[item]]
id = "JOU-06"
lens = "journalist"
directions = ["outbound", "inbound"]
dimension = "provability"
text = "Cause, scope and blame: does it state a cause, a scope or a reassurance ('no sensitive data', 'only a few users', 'isolated', 'resolved', 'it will not happen again', 'no jobs are at risk') that is not yet confirmed, name a culprit ('a temporary worker', 'one franchise store', 'a supplier', 'our account was hacked') before the facts establish it, and separate what is confirmed from what is still under investigation?"

[[item]]
id = "JOU-07"
lens = "journalist"
directions = ["outbound", "operation"]
dimension = "backlash"
text = "Across every version for each channel, language and audience (release, posts, staff note, customer email, Q&A): are the facts, numbers and commitments the same, so that no two can be put side by side as contradictory?"

[[item]]
id = "JOU-08"
lens = "journalist"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize", "rebut"]
dimension = "timing"
text = "Next update: does a holding or incident statement name a time and channel for the next update that we can keep, without promising a fix time we cannot guarantee?"

[[item]]
id = "JOU-09"
lens = "journalist"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize", "rebut"]
dimension = "backlash"
text = "Posture fit (situational crisis communication: victim, accidental or preventable): on what is known now, which is this for us, and do similar past incidents or a poor prior reputation make rebutting or clarifying read as denial? If an allegation has a factual basis, why is the answer not an apology?"

[[item]]
id = "SOC-07"
lens = "social"
directions = ["outbound"]
dimension = "stakeholder"
text = "If anyone may be harmed or affected (safety, money, data), does it tell them early whether they are affected and what to do now (stop using, refund, reset, contact), before explanation or defence?"

[[item]]
id = "SOC-08"
lens = "social"
directions = ["outbound", "operation", "inbound"]
dimension = "backlash"
text = "Removal: does the content or plan delete, hide or silently edit our posts or others' comments, or ask users to take posts down? Is each removal limited to unlawful or dangerous content and acknowledged publicly with its reason?"

[[item]]
id = "INT-04"
lens = "internal"
directions = ["outbound"]
dimension = "stakeholder"
text = "Staff: do employees hear this before or with the public, know where to route press and customer questions, and know not to post about it on personal accounts without disclosing that they work here?"

[[item]]
id = "RSP-04"
lens = "response"
directions = ["inbound"]
dimension = "legal"
text = "Before any reply, takedown request, hiding or deletion: is the hostile content preserved (URL, time, capture) for counsel and platform notices? Preserve content only; never collect data about the people behind accounts."

[[item]]
id = "APO-03"
lens = "journalist"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize"]
dimension = "provability"
text = "Apology commitments: is each corrective action specific and checkable, with an owner role, a deadline and a published follow-up date, and is the remedy given without making affected people come forward to claim it? (na if nothing calls for an apology)"

[[item]]
id = "EXP-04"
lens = "target"
directions = ["outbound", "operation"]
postures = ["expose"]
dimension = "ethics"
text = "Could the point be made against a practice, rule or system instead of the named party, and does naming the party add anything we can prove?"

[[item]]
id = "JOU-10"
lens = "journalist"
directions = ["outbound", "operation"]
dimension = "provability"
text = "Third-party support and results: does it claim an endorsement, partnership, approval, co-design or community backing ('supported by', 'designed with', 'welcomed by') that the third party has not confirmed for publication, present views heard at a consultation as endorsement, infer a public reaction ('netizens praise', 'widely welcomed') from a few posts, or state a forecast, pilot or target as an achieved result?"

[[item]]
id = "JOU-11"
lens = "journalist"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize", "rebut"]
dimension = "backlash"
text = "Labels: does the reply call the whole matter a rumour, a smear or black PR when it mixes fabrications with value judgements, lawful criticism or claims with a factual basis ('pure rumour, we reserve the right to sue')? Is each claim answered by its kind (evidence for a factual claim, preservation and legal routes for a fabrication, no endless argument over a value judgement), and is one legal threat aimed at all critics alike?"

[[item]]
id = "INT-05"
lens = "legal"
directions = ["outbound"]
dimension = "legal"
text = "Staff instructions: does a staff note or social media instruction ('do not discuss this with anyone', 'not even on personal accounts') restrict more than this jurisdiction's employment, labour and whistleblower law allows, and does it keep the routes to regulators, counsel and the internal hotline open?"

[[item]]
id = "REG-05"
lens = "regulator"
directions = ["outbound", "operation"]
dimension = "disclosure"
red_line = "undisclosed_inauthentic"
text = "Synthetic media: is any image, video, voice or text generated or materially altered by AI, above all one depicting a real person, place or event, labelled where this jurisdiction's law or the platform requires, and could a viewer take it as a real record?"

[[item]]
id = "RSP-05"
lens = "response"
directions = ["inbound"]
dimension = "stakeholder"
text = "Proportion: does the planned response match the harm and the actual spread (a small-circle claim answered in public creates its first searchable record; a lawyer's letter can be screenshotted), and where people are harmed or we bear responsibility, is low spread being used as a reason to stay silent?"

[[item]]
id = "SOC-09"
lens = "social"
directions = ["outbound"]
dimension = "stakeholder"
text = "Plain language and access: can the people affected grasp the core message in a few plain sentences, free of legal or official jargon and passive evasions ('mistakes were made'), and can they get it in an accessible form (text not only in images, alt text, captions, the languages they read)?"

[[item]]
id = "LEG-11"
lens = "legal"
directions = ["outbound", "inbound"]
postures = ["rebut", "clarify_apologize"]
dimension = "provability"
red_line = "fabrication_about_party"
text = "Strong labels: does a reply or platform notice call content 'false', 'never happened', 'malicious', 'organised' or the work of paid posters beyond what our records show? Is each denial bounded by the scope we actually checked ('no record found in X for period Y'), and is coordination left for the platform or counsel to establish rather than asserted?"

[[item]]
id = "REG-06"
lens = "regulator"
directions = ["operation", "inbound"]
dimension = "platform"
text = "Notice routes: does each takedown or platform notice use the route that fits the right at stake (copyright for copying, trademark for source confusion, defamation for a false statement of fact, privacy for personal data), never copyright or trademark against criticism, and does any signed statement claim no more than what was checked? Could the notice be held a misrepresentation or manifestly unfounded in this jurisdiction?"

[[item]]
id = "JOU-12"
lens = "journalist"
directions = ["outbound", "operation"]
dimension = "provability"
text = "Headline and preview: does the headline, first line, thumbnail or link preview claim more than the body supports, relying on a caveat further down ('pilot', 'not yet available', 'selected markets', 'terms apply') that a reader of the preview never sees?"

[[item]]
id = "SOC-10"
lens = "social"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize", "rebut"]
dimension = "backlash"
text = "One objective: does a single message mix clarifying, apologising, rebutting and promoting (a product plug, brand slogan or achievement in an apology or correction), so that the apology reads as advertising or the rebuttal as a denial?"

[[item]]
id = "INT-06"
lens = "internal"
directions = ["outbound"]
dimension = "stakeholder"
text = "Delivery: can customer service, operations, legal, channel partners and leadership actually honour every promise, remedy, contact path and date in the text (staffed hotline, refund process, stock, a named owner), and has each owner confirmed? If the conduct itself is not defensible, the action changes before the words."

[[item]]
id = "THR-05"
lens = "threat"
directions = ["inbound"]
dimension = "provability"
text = "For a hostile article or post: separate the editorial choices we can point to (ordering, sources, omitted context), the effect they may have, and any intent hypothesis. Is any claim of paid placement, sponsorship, coordination or AI generation backed by evidence beyond timing, tone, a beneficiary or reliance on one source? Never estimate whether it was AI-written, and never identify the people behind it."

[[item]]
id = "EXP-05"
lens = "target"
directions = ["outbound", "operation"]
postures = ["expose"]
dimension = "provability"
text = "Right of reply: before publication, has each allegation been put to the named party in writing with a reasonable time to answer, are the attempts recorded (date, channel), and does the text carry their answer or say plainly that they declined or did not reply? Does a claim from the party's adversary have independent corroboration?"

[[item]]
id = "LEG-13"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
dimension = "provability"
red_line = "fabrication_about_party"
text = "Repeated accusations: does it restate as established fact an accusation made by someone else (a legislator in the chamber, a party or candidate, a media report, an anonymous source, an investigation before charge or judgment)? A speaker's privilege, such as a legislator's immunity, does not pass to us: attribute it ('X alleged'), say 'suspected' or 'accused' until a judgment, and respect the secrecy of an ongoing investigation in this jurisdiction."

[[item]]
id = "JOU-13"
lens = "journalist"
directions = ["outbound", "operation"]
dimension = "provability"
text = "Polls and surveys: does every poll or survey we cite (ours or another's) give the sample size, margin of error, method, who commissioned and who ran it, and the fieldwork dates; does it avoid calling a gap within the margin of error a lead, or a snapshot a forecast; is a sponsor with a stake named; and does any election poll fall in this jurisdiction's publication blackout?"

[[item]]
id = "POL-04"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "backlash"
text = "Neutrality (na when our identity is a political party): for an organisation that means to stay out of politics, does the wording take a side through loaded labels for parties, people or policies, verbs that trust one side and doubt the other ('explained' against 'claimed'), or naming only one party? Swap the parties' names: does the sentence still read as fair? Quote what fails. Assess only; never rewrite partisan content to look neutral."

[[item]]
id = "JOU-14"
lens = "journalist"
directions = ["outbound", "inbound"]
dimension = "provability"
text = "Done or planned: does the text present an action as taken (paused, recalled, refunded, reported to the regulator, independent review appointed) when it is only proposed, pending approval or partial? Each action should read as done, decided with a date, or under consideration, matching our records."

[[item]]
id = "INT-07"
lens = "internal"
directions = ["outbound"]
dimension = "stakeholder"
text = "Bounded commitments: does it promise 'full compensation', 'unconditional refunds', 'we bear all losses' or a company-wide halt beyond a scope, budget and authority already confirmed? Does it say what continues as normal (unaffected batches, orders, stores) so customers and partners do not panic, and does it avoid shifting the cost onto suppliers, dealers, franchisees or staff?"

[[item]]
id = "LEG-12"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
dimension = "legal"
red_line = "privacy_doxxing"
text = "Vulnerable people: does it identify, or give details that together identify, a minor, a victim of sexual violence, or a person in a suspected suicide or self-harm case (name, photo, school, workplace, address, relatives), which this jurisdiction may forbid? Where suicide or self-harm is mentioned, does it avoid method and location detail and give help-line information, following the WHO media guidelines?"

[[item]]
id = "RSP-06"
lens = "response"
directions = ["inbound"]
dimension = "legal"
text = "Crimes against people: does the hostile activity include threats of violence, extortion ('pay or we publish'), a leak of a home address or other personal data leading to harassment, or attacks on a minor? Then the first step is safety, a police report and a platform report with the preserved content, not a public statement or a lawyer's letter. Leave identifying the people behind accounts to the police and platforms."

[[item]]
id = "SOC-11"
lens = "social"
directions = ["outbound", "inbound"]
postures = ["clarify_apologize", "rebut"]
dimension = "backlash"
text = "Expectation gap: when people are upset because a product or service differed from what they were led to expect (freshly made, a real discount, a human answer), does the reply answer with a legal or technical definition ('complies with regulations', 'by industry definition this is not X') instead of addressing the gap and what we disclose from now on?"

# ---- the stakeholder map (D-0003): one item per group, per jurisdiction ----

[[item]]
id = "STK-01"
lens = "stakeholders"
directions = ["outbound", "operation", "inbound"]
dimension = "stakeholder"
text = "Governance (executives, board, rank-and-file staff, whistleblowers): how does each face and handle this, are their duties and statements aligned, and is anyone left to speak for the company without a mandate?"

[[item]]
id = "STK-02"
lens = "stakeholders"
directions = ["outbound", "operation", "inbound"]
dimension = "stakeholder"
text = "Business chain and consumers (people affected, the watching public, loyal fans, distributors and suppliers, contract partners, advertisers and endorsers): how does each react, what do they need from us, and who could walk away or turn against us?"

[[item]]
id = "STK-03"
lens = "stakeholders"
directions = ["outbound", "operation", "inbound"]
dimension = "stakeholder"
text = "Capital markets (angel, VC and PE investors; institutions, retail investors and analysts; lending banks and creditors): how does each read this, does it trigger disclosure, covenant or confidence questions, and are they told in the right order?"

[[item]]
id = "STK-04"
lens = "stakeholders"
directions = ["outbound", "operation", "inbound"]
dimension = "stakeholder"
text = "Authorities and adversaries in law (regulators and law enforcement in this jurisdiction; opposing counsel, potential class or civic groups): what would prompt each to act, and what will they ask us to show?"

[[item]]
id = "STK-05"
lens = "stakeholders"
directions = ["outbound", "operation", "inbound"]
dimension = "stakeholder"
text = "Opinion (media and journalists; industry influencers and commentators; forum opinion leaders and core community members in this jurisdiction): which outlets, platforms and communities amplify or debunk this, what angle will each take, and what do they need from us on the record? Describe roles and communities, never named private accounts."

[[item]]
id = "STK-06"
lens = "stakeholders"
directions = ["outbound", "operation", "inbound"]
dimension = "stakeholder"
text = "Rivals (competitors, professional short sellers and debunking outfits, flank sockpuppet networks): how could each exploit or distort this, and what lawful, on-the-record answer do we have? Assess only; never suggest countering with sockpuppets."

[[item]]
id = "STK-07"
lens = "stakeholders"
directions = ["outbound", "operation", "inbound"]
dimension = "stakeholder"
text = "Politics (the ruling and opposition parties, and the party and state organs listed for this jurisdiction): how could each use this (hearings, legislation, statements, rallying, state media lines), and does our content take a political side?"

# ---- stress tests (D-0003; user, 2026-10-22): asked before a statement is final ----

[[item]]
id = "RTM-01"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "legal"
text = "Legal floor (opposing counsel, regulators): does any sentence amount to an admission of fault or liability in court, or admit a violation? Quote it."

[[item]]
id = "RTM-02"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "backlash"
text = "Public emotion (people affected, community members): does it read as a sincere admission or as an arrogant word game? Quote the sentence that decides it."

[[item]]
id = "RTM-03"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "stakeholder"
text = "Internal front (rank-and-file staff, the executives involved): would staff be angry enough to post an insider rebuttal on an anonymous forum, or the individual at the centre (as a role, not a person) post something uncontrolled? Quote the trigger."

[[item]]
id = "RTM-04"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "stakeholder"
text = "Business lifeline (investors, key distributors): before the market opens tomorrow, does this statement stop institutions selling and distributors pulling the product? Quote what reassures or alarms them."

[[item]]
id = "RTM-05"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "backlash"
text = "Opinion ammunition (beat reporters, competitors and their amplifiers): is there a sentence a rival can screenshot as a mocking meme or a headline? Quote it."

[[item]]
id = "POL-01"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "backlash"
text = "Political ammunition: is there a sentence the opposition or a hostile faction could put on a slide at a legislative hearing tomorrow as proof of government failure or collusion between government and business? Quote it."

[[item]]
id = "POL-02"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "backlash"
text = "Polarised trap: answering a group one party backs, is the wording so accommodating that the other side labels us and calls a nationwide political boycott? Quote the wording."

[[item]]
id = "POL-03"
lens = "stakeholders"
directions = ["outbound", "inbound"]
dimension = "backlash"
text = "Sovereign red line: for a company operating across regions, would the version for this jurisdiction, set side by side with versions for others (Taiwan, the US and Europe, mainland China), get us called two-faced? Name the terms that differ."

# ---- role items (D-0003): asked only when one of our identities has the party type ----

[[item]]
id = "ROL-01"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["board"]
dimension = "legal"
text = "As the board: is the decision and its disclosure within the board's duties and recorded, is an independent committee needed where executives are conflicted, and does the communication match what the board approved?"

[[item]]
id = "ROL-02"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["executives"]
dimension = "legal"
text = "As executives: what personal liability or securities exposure do the named executives carry, do their statements match the company's, and do they stay off personal accounts on this?"

[[item]]
id = "ROL-03"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["whistleblower"]
dimension = "legal"
text = "As a whistleblower: are the lawful channels (internal hotline, regulator, prosecutor) used first, is the whistleblower's identity protected, and does any disclosure stay within what this jurisdiction's whistleblower protection covers (no trade secrets or personal data beyond it)?"

[[item]]
id = "ROL-04"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["short_activists"]
dimension = "legal"
red_line = "market_manipulation"
text = "As a short seller or debunking outfit: is our position disclosed, is every claim sourced and stated as fact or opinion, and is the timing lawful (no trading on material non-public information, no short-and-distort)?"

[[item]]
id = "ROL-05"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["partners"]
dimension = "legal"
text = "As a contract partner, advertiser or endorser: does our contract (morality clause, exclusivity, approval rights, termination) allow or require this statement, and are we jointly liable under this jurisdiction's endorsement and advertising rules?"

[[item]]
id = "ROL-06"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["channel"]
dimension = "legal"
text = "As a distributor, dealer or supplier: what notice, recall and cooperation duties do our contracts and this jurisdiction impose, and does the statement shift blame up or down the chain without evidence?"

[[item]]
id = "ROL-07"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["victims"]
dimension = "legal"
text = "As an affected person: does the statement describe the harm without defaming anyone, is evidence preserved, and are the lawful remedies used (consumer body, regulator complaint, small claims, collective action)?"

[[item]]
id = "ROL-08"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["staff"]
dimension = "legal"
text = "As employees: do confidentiality duties, employment law and the company's social media policy allow this, and is it clearly said in a personal or an official capacity?"

[[item]]
id = "ROL-09"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["regulators"]
dimension = "legal"
text = "As an authority: does the communication respect administrative neutrality, due process for the parties and the rules on disclosing information about an ongoing case?"

[[item]]
id = "ROL-10"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["media", "kol", "community_leaders"]
dimension = "disclosure"
text = "As media, a KOL or a community leader: are sponsorships and relationships with the parties disclosed, is the right of reply offered, and does a correction policy apply if this proves wrong?"

[[item]]
id = "ROL-12"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["ruling_party", "opposition_party"]
dimension = "legal"
red_line = "election_law"
text = "As a political party: do election, lobbying and political-advertising rules apply (disclosure of the sponsor, blackout periods, foreign funding), and is every claim about opponents provable? No disinformation, no undisclosed paid amplification."

[[item]]
id = "ROL-13"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["implicated_individual"]
dimension = "legal"
text = "As the individual at the centre: does a public statement prejudice our defence or an investigation, is it coordinated with counsel and the employer's statement, and does it avoid defaming anyone or disclosing others' personal data?"

[[item]]
id = "ROL-11"
lens = "legal"
directions = ["outbound", "operation", "inbound"]
roles = ["private_investors", "public_investors", "lenders"]
dimension = "legal"
text = "As an investor or creditor: are our holdings or exposure disclosed where required, do insider-trading and fair-disclosure rules limit what we may say or trade, and do covenants or confidentiality agreements apply?"
